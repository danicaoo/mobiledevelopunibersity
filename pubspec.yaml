name: camera_app
description: Приложение для работы с камерой и галереей
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.1
  permission_handler: ^11.3.0
  path_provider: ^2.1.4
  image: ^4.1.4  # Для дополнительной обработки изображений
  video_player: ^2.8.3
  chewie: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true